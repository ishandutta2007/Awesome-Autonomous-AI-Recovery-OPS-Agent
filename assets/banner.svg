<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.25); opacity: 0.6; }
    }
    
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)"/>
  <rect width="1200" height="420" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 2. Dynamic Ambient Glow Orbs (Background layer) -->
  <g>
    <!-- Top-Left Cyan Glow Orb -->
    <circle cx="220" cy="110" r="140" fill="#06b6d4" filter="url(#softGlow)" opacity="0.28">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="130;160;130" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Indigo Glow Orb -->
    <circle cx="650" cy="220" r="170" fill="#6366f1" filter="url(#softGlow)" opacity="0.22">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="640;670;640" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom-Right Purple Glow Orb -->
    <circle cx="1020" cy="320" r="150" fill="#a855f7" filter="url(#softGlow)" opacity="0.25">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="140;170;140" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3. Dynamic Animated Circuit & Telemetry Data Streams -->
  <g opacity="0.75">
    <!-- Stream Line 1 -->
    <path d="M 50 80 L 320 80 L 390 140 L 850 140 L 910 80 L 1150 80" 
          fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 50 80 L 320 80 L 390 140 L 850 140 L 910 80 L 1150 80" 
          fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="80 180" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="520;0" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Stream Line 2 (Cross Connection) -->
    <path d="M 80 340 L 280 340 L 350 280 L 820 280 L 890 340 L 1120 340" 
          fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 80 340 L 280 340 L 350 280 L 820 280 L 890 340 L 1120 340" 
          fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="100 240" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;680" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Pulsing Node Dots -->
    <circle cx="390" cy="140" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3.5;6;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="140" r="4" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="4;6.5;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="280" r="4" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="3.5;6;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="280" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;6.5;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4. Foreground Content Layer (Always clear, crisp and unoccluded) -->

  <!-- Top Badge: Category Pill -->
  <g transform="translate(600, 72)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-162" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="-144" y="5" class="font-mono" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="2">
      AUTONOMOUS RESILIENCE &amp; SRE
    </text>
  </g>

  <!-- Main Title: Awesome Autonomous AI Recovery OPS Agent -->
  <!-- Subtle back shadow for high contrast readability -->
  <text x="600" y="172" text-anchor="middle" class="font-sans" font-size="44" font-weight="900" fill="#030712" opacity="0.7" letter-spacing="-0.8">
    Awesome Autonomous AI Recovery OPS Agent
  </text>
  <text x="600" y="170" text-anchor="middle" class="font-sans" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.8" filter="url(#glow)">
    Awesome Autonomous AI Recovery OPS Agent
  </text>
  <text x="600" y="170" text-anchor="middle" class="font-sans" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.8">
    Awesome Autonomous AI Recovery OPS Agent
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" class="font-sans" font-size="18.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Curated Self-Healing Architecture, Intelligent SRE Agents &amp; Automated Incident Recovery
  </text>

  <!-- Dynamic Feature Metric Pills (Foreground Row) -->
  <g transform="translate(130, 290)">
    <!-- Pill 1: Agentic RCA -->
    <g transform="translate(0, 0)">
      <rect width="210" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="28" cy="24" r="7" fill="#06b6d4" opacity="0.3"/>
      <circle cx="28" cy="24" r="4" fill="#38bdf8"/>
      <text x="48" y="22" class="font-sans" font-size="13" font-weight="700" fill="#f1f5f9">Agentic RCA</text>
      <text x="48" y="37" class="font-mono" font-size="10.5" fill="#64748b">LLM Tool Diagnostics</text>
    </g>

    <!-- Pill 2: Self-Healing Ops -->
    <g transform="translate(242, 0)">
      <rect width="210" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="28" cy="24" r="7" fill="#818cf8" opacity="0.3"/>
      <circle cx="28" cy="24" r="4" fill="#818cf8"/>
      <text x="48" y="22" class="font-sans" font-size="13" font-weight="700" fill="#f1f5f9">Self-Healing Ops</text>
      <text x="48" y="37" class="font-mono" font-size="10.5" fill="#64748b">Runbook Automation</text>
    </g>

    <!-- Pill 3: Instant Failover -->
    <g transform="translate(484, 0)">
      <rect width="210" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="28" cy="24" r="7" fill="#a855f7" opacity="0.3"/>
      <circle cx="28" cy="24" r="4" fill="#c084fc"/>
      <text x="48" y="22" class="font-sans" font-size="13" font-weight="700" fill="#f1f5f9">Instant Failover</text>
      <text x="48" y="37" class="font-mono" font-size="10.5" fill="#64748b">Snapshot &amp; State Rollback</text>
    </g>

    <!-- Pill 4: Telemetry Correlation -->
    <g transform="translate(726, 0)">
      <rect width="210" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="28" cy="24" r="7" fill="#10b981" opacity="0.3"/>
      <circle cx="28" cy="24" r="4" fill="#34d399"/>
      <text x="48" y="22" class="font-sans" font-size="13" font-weight="700" fill="#f1f5f9">AIOps Intelligence</text>
      <text x="48" y="37" class="font-mono" font-size="10.5" fill="#64748b">Causal Topology Graphs</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(0, 392)">
    <line x1="20" y1="0" x2="1180" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="18" class="font-mono" font-size="11" fill="#475569">
      [STATUS] SRE_AGENTS: ACTIVE // HEURISTIC_MONITORING: ON // RECOVERY_LOOP: READY
    </text>
    <text x="1160" y="18" text-anchor="end" class="font-mono" font-size="11" fill="#0ea5e9">
      v2.0 • CNCF &amp; MULTI-CLOUD COMPATIBLE
    </text>
  </g>
</svg>
